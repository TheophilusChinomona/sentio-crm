name: Sentio image and staging validation
on:
  workflow_dispatch:
  push:
    branches: [sentio-v16]
    tags: ['sentio-v*']
  pull_request:
    branches: [sentio-v16]
permissions:
  contents: read
  packages: write
concurrency:
  group: sentio-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRM_SITE: sentio.localhost
      SENTIO_CLIENT_ID: test-client
      DB_ROOT_PASSWORD: disposable-ci-db-password
      CRM_ADMIN_PASSWORD: disposable-ci-admin-password
      SENTIO_IMAGE: local/sentio-crm:consolidated
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Local policy and deployment contracts
        run: |
          python3 -m unittest discover -s tests_sentio
          python3 -m unittest discover -s crm/sentio/tests
          node --test tests_sentio/mailServers.node.mjs
          bash -n deploy/*.sh
          docker compose config --quiet
      - name: Build the checked-out source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          load: true
          tags: local/sentio-crm:consolidated
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start disposable staging stack
        run: |
          docker network create dokploy-network
          docker compose -f compose.yaml -f deploy/compose.ci.yaml up -d --no-build
          bash deploy/validate-staging.sh
      - name: Publish only the validated image
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$SENTIO_IMAGE" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/sentio-v* ]]; then
            docker tag "$SENTIO_IMAGE" "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=150
      - name: Remove disposable test data
        if: always()
        run: docker compose down --volumes --remove-orphans
